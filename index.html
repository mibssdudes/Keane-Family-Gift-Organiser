<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matthew's Birthday & Christmas Gift List</title>
    <style>
        :root {
            --bg-cream: #FAF6ED;
            --card-navy: #0E1E38;
            --coral-pink: #E9968A;
            --coral-hover: #D67F73;
            --text-dark: #2B2B2B;
            --panel-bg: #F0F2F5;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* --- GATEWAY HOMEPAGE --- */
        #gateway-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }

        .gateway-card {
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
        }

        .gateway-card h1 {
            color: var(--card-navy);
            margin-bottom: 10px;
            font-size: 24px;
        }

        .gateway-card p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
        }

        .btn-primary {
            background-color: var(--card-navy);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: #1a335c;
        }

        .btn-secondary {
            background-color: var(--coral-pink);
            color: var(--white);
        }

        .btn-secondary:hover {
            background-color: var(--coral-hover);
        }

        /* PIN Area */
        .pin-area {
            display: none;
            margin-top: 15px;
            animation: fadeIn 0.3s ease;
        }

        .pin-input {
            padding: 12px;
            width: 180px;
            text-align: center;
            font-size: 18px;
            letter-spacing: 4px;
            border: 2px solid #ccc;
            border-radius: 6px;
            margin-bottom: 12px;
            outline: none;
        }

        /* --- MAIN APP LAYOUT --- */
        #main-app {
            display: none;
        }

        header {
            margin-bottom: 25px;
        }

        header .tag {
            color: var(--coral-pink);
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header h1 {
            color: var(--card-navy);
            font-size: 28px;
            margin: 4px 0;
        }

        header p {
            font-size: 13px;
            color: #666;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 850px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .family-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero-banner {
            background-color: var(--card-navy);
            color: var(--white);
            border-radius: 12px;
            padding: 24px;
        }

        .hero-banner span {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        .hero-banner h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .hero-banner p {
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 16px;
        }

        .name-input-group {
            display: flex;
            gap: 10px;
            max-width: 400px;
        }

        .name-input-group input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            outline: none;
        }

        .gift-section-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--card-navy);
            margin-bottom: 12px;
        }

        .gift-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .gift-card {
            background: var(--white);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            border-top: 3px solid var(--coral-pink);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .gift-title {
            font-weight: bold;
            font-size: 14px;
            color: var(--card-navy);
        }

        .gift-desc {
            font-size: 12px;
            color: #777;
            margin: 6px 0 12px 0;
            line-height: 1.4;
        }

        .gift-price {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .btn-card {
            width: 100%;
            padding: 8px;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #ccc;
            color: var(--text-dark);
        }

        .owner-panel {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .owner-section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--coral-pink);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .stat-box {
            background: var(--white);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box span {
            display: block;
            font-size: 10px;
            color: #777;
        }

        .stat-box strong {
            font-size: 16px;
            color: var(--card-navy);
        }

        .form-block {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }

        .logout-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- GATEWAY HOMEPAGE -->
        <section id="gateway-page">
            <div class="gateway-card">
                <h1>Matthew's Gift List</h1>
                <span style="color: var(--coral-pink); font-size: 12px; font-weight: bold; letter-spacing: 1px; display: block; margin-bottom: 12px;">BIRTHDAY & CHRISTMAS MAGIC</span>
                <p>Welcome! Please select your entry point to manage or view items.</p>
                
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="enterAsFamily()">Family Member</button>
                    <button class="btn btn-primary" onclick="showPinPrompt()">List Owner</button>
                </div>

                <div class="pin-area" id="pin-area">
                    <label style="display:block; font-size:12px; margin-bottom:8px; font-weight:600;">ENTER 8-DIGIT SECURITY PIN:</label>
                    <input type="password" id="pin-input" class="pin-input" maxlength="8" placeholder="••••••••">
                    <br>
                    <button class="btn btn-primary" style="padding: 10px 20px; font-size:13px;" onclick="verifyOwnerPin()">Verify PIN</button>
                </div>
            </div>
        </section>

        <!-- DASHBOARD FRAME -->
        <main id="main-app">
            <div class="logout-bar">
                <button class="btn btn-outline" style="padding: 6px 12px; font-size:12px; border-radius: 6px;" onclick="logOut()">← Back to Entry</button>
            </div>

            <header>
                <span class="tag">Active Session Active ♦</span>
                <h1>Matthew's Birthday & Christmas Gift List</h1>
                <p>Explore choices below or add new entries to the stream grid logs.</p>
            </header>

            <div class="dashboard-grid">
                <section class="family-panel">
